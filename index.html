<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engineering GPA Calculator & Local Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans min-h-screen pb-12">

    <header class="bg-blue-900 text-white py-6 shadow-md mb-8">
        <div class="max-w-5xl mx-auto px-4 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold tracking-wide">Faculty of Engineering</h1>
                <p class="text-sm text-blue-200">Personal GPA Tracker (Data Saved Locally on Your Device)</p>
            </div>
            <div id="gpaBadge" class="bg-green-500 text-white px-6 py-3 rounded-lg text-center shadow">
                <span class="block text-xs uppercase font-semibold">Current GPA</span>
                <span id="gpaDisplay" class="text-2xl font-black">0.00</span>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 grid grid-cols-1 md:grid-cols-3 gap-8">
        
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 h-fit">
            <h2 class="text-lg font-bold text-gray-800 mb-4">Add Course Module</h2>
            <form id="subjectForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Subject Name / Code</label>
                    <input type="text" id="subjectName" required placeholder="e.g., EC1020 Electronics" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Credits</label>
                        <input type="number" id="subjectCredits" required min="1" max="6" value="3" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Grade</label>
                        <select id="subjectGrade" required class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
                            <option value="4.00">A+</option>
                            <option value="4.00">A</option>
                            <option value="3.70">A-</option>
                            <option value="3.30">B+</option>
                            <option value="3.00">B</option>
                            <option value="2.70">B-</option>
                            <option value="2.30">C+</option>
                            <option value="2.00">C</option>
                            <option value="1.70">C-</option>
                            <option value="1.30">D+</option>
                            <option value="1.00">D</option>
                            <option value="0.00">E</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="w-full bg-blue-700 text-white py-2 rounded-md hover:bg-blue-800 transition font-medium text-sm shadow">
                    Securely Save Module
                </button>
            </form>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 md:col-span-2">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-gray-800">Your Saved Course Records</h2>
                <span id="subjectCount" class="text-xs font-semibold bg-gray-100 text-gray-600 px-2.5 py-1 rounded-full">0 Subjects</span>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-gray-200 text-xs font-bold text-gray-500 uppercase bg-gray-50">
                            <th class="py-3 px-4">Subject</th>
                            <th class="py-3 px-4 text-center">Credits</th>
                            <th class="py-3 px-4 text-center">Grade Point</th>
                            <th class="py-3 px-4 text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="subjectTableBody" class="divide-y divide-gray-100 text-sm text-gray-700">
                        </tbody>
                </table>
            </div>
            
            <div id="emptyState" class="text-center py-12 text-gray-400 text-sm">
                No subjects saved yet. Records will be persisted locally here upon entry.
            </div>
        </div>
    </main>

    <script>
        // Data Extraction Layer from Browser LocalStorage Vault
        // Restores previous session data automatically or initializes an empty array
        let subjects = JSON.parse(localStorage.getItem('my_gpa_data')) || [];

        const form = document.getElementById('subjectForm');
        const tableBody = document.getElementById('subjectTableBody');
        const emptyState = document.getElementById('emptyState');
        const gpaDisplay = document.getElementById('gpaDisplay');
        const subjectCountLabel = document.getElementById('subjectCount');

        // Form Submit Controller (Write & Save Data)
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const name = document.getElementById('subjectName').value;
            const credits = parseInt(document.getElementById('subjectCredits').value);
            const selectEl = document.getElementById('subjectGrade');
            const gpv = parseFloat(selectEl.value);
            const gradeText = selectEl.options[selectEl.selectedIndex].text;

            const newRecord = { id: Date.now(), name, credits, gpv, gradeText };
            subjects.push(newRecord);
            
            saveToLocalStorage();
            form.reset();
            document.getElementById('subjectCredits').value = 3; // Reset default credit selection
            
            updateUI();
        });

        // Delete Controller (Modify Storage State)
        function removeSubject(id) {
            subjects = subjects.filter(sub => sub.id !== id);
            saveToLocalStorage();
            updateUI();
        }

        // Dropdown Inline Edit Controller (Update Storage State)
        function changeGradeInline(id, element) {
            const index = subjects.findIndex(sub => sub.id === id);
            if (index !== -1) {
                subjects[index].gpv = parseFloat(element.value);
                subjects[index].gradeText = element.options[element.selectedIndex].text;
                saveToLocalStorage();
                calculateGPA();
            }
        }

        // Browser Storage Synchronization Wrapper
        function saveToLocalStorage() {
            localStorage.setItem('my_gpa_data', JSON.stringify(subjects));
        }

        // Evaluation Logic Core
        function calculateGPA() {
            if (subjects.length === 0) {
                gpaDisplay.textContent = "0.00";
                return;
            }

            let totalWeightedPoints = 0;
            let totalCredits = 0;

            subjects.forEach(sub => {
                // Filter out non-gpa courses like industrial training automatically
                if(!sub.name.toLowerCase().includes("industrial training")) {
                    totalWeightedPoints += (sub.credits * sub.gpv);
                    totalCredits += sub.credits;
                }
            });

            if (totalCredits === 0) {
                gpaDisplay.textContent = "0.00";
                return;
            }

            const rawGPA = totalWeightedPoints / totalCredits;
            // Rounded up to nearest 0.05 per faculty curriculum specifications
            const finalizedGPA = (Math.ceil(rawGPA * 20) / 20).toFixed(2);
            
            gpaDisplay.textContent = finalizedGPA;
        }

        // UI Presentation Synchronizer
        function updateUI() {
            tableBody.innerHTML = '';
            subjectCountLabel.textContent = `${subjects.length} Subject${subjects.length !== 1 ? 's' : ''}`;

            if (subjects.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                
                subjects.forEach(sub => {
                    const row = document.createElement('tr');
                    row.className = "hover:bg-gray-50 transition";
                    row.innerHTML = `
                        <td class="py-3 px-4 font-medium text-gray-900">${sub.name}</td>
                        <td class="py-3 px-4 text-center">${sub.credits}</td>
                        <td class="py-3 px-4 text-center">
                            <select onchange="changeGradeInline(${sub.id}, this)" class="bg-gray-100 border border-transparent rounded px-2 py-1 focus:bg-white focus:border-gray-300 text-xs font-semibold cursor-pointer">
                                <option value="4.00" ${sub.gradeText === 'A+' ? 'selected' : ''}>A+</option>
                                <option value="4.00" ${sub.gradeText === 'A' ? 'selected' : ''}>A</option>
                                <option value="3.70" ${sub.gradeText === 'A-' ? 'selected' : ''}>A-</option>
                                <option value="3.30" ${sub.gradeText === 'B+' ? 'selected' : ''}>B+</option>
                                <option value="3.00" ${sub.gradeText === 'B' ? 'selected' : ''}>B</option>
                                <option value="2.70" ${sub.gradeText === 'B-' ? 'selected' : ''}>B-</option>
                                <option value="2.30" ${sub.gradeText === 'C+' ? 'selected' : ''}>C+</option>
                                <option value="2.00" ${sub.gradeText === 'C' ? 'selected' : ''}>C</option>
                                <option value="1.70" ${sub.gradeText === 'C-' ? 'selected' : ''}>C-</option>
                                <option value="1.30" ${sub.gradeText === 'D+' ? 'selected' : ''}>D+</option>
                                <option value="1.00" ${sub.gradeText === 'D' ? 'selected' : ''}>D</option>
                                <option value="0.00" ${sub.gradeText === 'E' ? 'selected' : ''}>E</option>
                            </select>
                        </td>
                        <td class="py-3 px-4 text-center">
                            <button onclick="removeSubject(${sub.id})" class="text-red-500 hover:text-red-700 text-xs font-medium bg-red-50 px-2 py-1 rounded transition">Delete</button>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });
            }
            calculateGPA();
        }

        // Initializing the View on Application Boot
        updateUI();
    </script>
</body>
</html>
